name: Cloud Account Cleanup

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cloud-account-cleanup.yml'
      - 'tools/cloud_cleanup.py'
      - 'tools/expire_messages.py'
      - 'tools/cleanup_readiness.py'
      - 'tools/cleanup_inventory.py'
      - 'tools/cleanup-policy.json'
  workflow_dispatch:
    inputs:
      check_only:
        description: Validate credentials without processing deletion requests
        type: boolean
        default: true
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

concurrency:
  group: cloud-account-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || vars.ENABLE_CLOUD_ACCOUNT_CLEANUP != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_PROJECT_ID: liquid-chat-v2
      CLOUDINARY_CLOUD_NAME: ${{ vars.CLOUDINARY_CLOUD_NAME || 'mthzgqhv' }}
      CLOUDINARY_UPLOAD_PRESET: liquid_chat_owned_v1
      CLEANUP_AUTOMATION_ENABLED: ${{ vars.ENABLE_CLOUD_ACCOUNT_CLEANUP || 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify cleanup credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        shell: bash
        run: |
          missing=0
          for credential in FIREBASE_SERVICE_ACCOUNT_JSON CLOUDINARY_API_KEY CLOUDINARY_API_SECRET; do
            if [[ -z "${!credential}" ]]; then
              echo "::error::Missing $credential"
              missing=1
            fi
          done
          test "$missing" -eq 0 || exit 1
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/cleanup-account.json"
          chmod 600 "$RUNNER_TEMP/cleanup-account.json"
      - name: Install trusted worker dependencies
        run: python -m pip install 'firebase-admin==7.1.0' 'requests==2.32.5'
      - name: Validate configuration or process owner-requested deletions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/cleanup-account.json
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          LEGACY_MEDIA_APPROVALS_JSON: ${{ secrets.LEGACY_MEDIA_APPROVALS_JSON }}
          # Publishing worker code always validates without processing requests
          # or updating the runtime heartbeat, even when automation is enabled.
          CHECK_ONLY: ${{ github.event_name == 'push' || inputs.check_only }}
        shell: bash
        run: |
          if [[ "$CHECK_ONLY" == 'true' ]]; then
            python tools/cloud_cleanup.py --audit-only
          else
            python tools/cloud_cleanup.py
          fi
      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/cleanup-account.json"
