name: Apply Network Banner

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-network-banner.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/apply_network_banner.py
      - name: Commit changes
        run: |
          git config user.name 'officialpritam007'
          git config user.email 'officialpritam07@gmail.com'
          git add app/src/main/java/com/example/ui/LiquidChatApp.kt
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Show Liquid Glass offline retry banner'
          git push origin HEAD:main
