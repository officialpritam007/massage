name: Deploy Firebase Rules

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'firestore.rules'
      - 'database.rules.json'
      - 'firebase.json'

permissions:
  contents: read

jobs:
  deploy:
    name: Publish Firebase rules
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: liquid-chat-v2

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Validate Firebase service account secret
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [[ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]]; then
            echo "::error::Missing repository secret FIREBASE_SERVICE_ACCOUNT_JSON."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          python3 - <<'PY'
          import json, os
          path = os.path.join(os.environ['RUNNER_TEMP'], 'firebase-service-account.json')
          with open(path, encoding='utf-8') as f:
              data = json.load(f)
          required = {'project_id', 'client_email', 'private_key'}
          missing = sorted(required - set(data))
          if missing:
              raise SystemExit('Service account JSON is missing: ' + ', '.join(missing))
          if data['project_id'] != os.environ['FIREBASE_PROJECT_ID']:
              raise SystemExit(
                  f"Service account project_id {data['project_id']} does not match {os.environ['FIREBASE_PROJECT_ID']}"
              )
          print('Firebase service account validated for', data['project_id'])
          PY

      - name: Install Google auth client
        run: python3 -m pip install --disable-pip-version-check google-auth requests

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy Firestore rules through Firebase Rules API
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession

          project = os.environ['FIREBASE_PROJECT_ID']
          credentials_path = os.environ['GOOGLE_APPLICATION_CREDENTIALS']
          credentials = service_account.Credentials.from_service_account_file(
              credentials_path,
              scopes=['https://www.googleapis.com/auth/cloud-platform'],
          )
          session = AuthorizedSession(credentials)

          rules = Path('firestore.rules').read_text(encoding='utf-8')
          ruleset_url = f'https://firebaserules.googleapis.com/v1/projects/{project}/rulesets'
          response = session.post(
              ruleset_url,
              json={
                  'source': {
                      'files': [
                          {
                              'name': 'firestore.rules',
                              'content': rules,
                          }
                      ]
                  }
              },
              timeout=60,
          )
          if not response.ok:
              raise SystemExit(f'Ruleset create failed ({response.status_code}): {response.text}')
          ruleset_name = response.json()['name']
          print('Created ruleset:', ruleset_name)

          release_name = f'projects/{project}/releases/cloud.firestore'
          release_url = f'https://firebaserules.googleapis.com/v1/{release_name}'
          current = session.get(release_url, timeout=30)

          if current.status_code == 404:
              publish = session.post(
                  f'https://firebaserules.googleapis.com/v1/projects/{project}/releases',
                  json={
                      'name': release_name,
                      'rulesetName': ruleset_name,
                  },
                  timeout=60,
              )
          elif current.ok:
              publish = session.patch(
                  release_url,
                  json={
                      'release': {
                          'name': release_name,
                          'rulesetName': ruleset_name,
                      },
                      'updateMask': 'rulesetName',
                  },
                  timeout=60,
              )
          else:
              raise SystemExit(f'Release lookup failed ({current.status_code}): {current.text}')

          if not publish.ok:
              raise SystemExit(f'Rules publish failed ({publish.status_code}): {publish.text}')

          verify = session.get(release_url, timeout=30)
          if not verify.ok:
              raise SystemExit(f'Rules verification failed ({verify.status_code}): {verify.text}')
          live_ruleset = verify.json().get('rulesetName')
          if live_ruleset != ruleset_name:
              raise SystemExit(f'Published ruleset mismatch: expected {ruleset_name}, got {live_ruleset}')

          print('Firestore rules are live:', live_ruleset)
          PY

      - name: Deploy Realtime Database presence rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          npx --yes firebase-tools@14.15.1 deploy --only database --project "$FIREBASE_PROJECT_ID" --non-interactive

      - name: Remove temporary credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
