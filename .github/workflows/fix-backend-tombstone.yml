name: Apply Confirmed Messaging Hardening

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-backend-tombstone.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply hardening patch
        run: python scripts/apply_confirmed_hardening.py

      - name: Validate backend syntax
        run: node --check appwrite-functions/liquid-api/src/main.js

      - name: Validate permanent deletion wiring
        run: |
          grep -q "hiddenFor," appwrite-functions/liquid-api/src/main.js
          grep -q "hiddenFor: \[\]" appwrite-functions/liquid-api/src/main.js
          grep -q "where('mediaUrl', '==', mediaRef)" appwrite-functions/liquid-api/src/main.js

      - name: Commit source changes
        run: |
          git config user.name 'officialpritam007'
          git config user.email 'officialpritam07@gmail.com'
          git add appwrite-functions/liquid-api/src/main.js \
                  app/src/main/java/com/example/data/network/LiquidApi.kt \
                  app/src/main/java/com/example/data/repository/ChatRepository.kt \
                  app/src/main/java/com/example/notifications/LiquidFirebaseMessagingService.kt \
                  app/src/main/java/com/example/ui/screens/ChatsHomeScreen.kt \
                  app/src/main/java/com/example/ui/screens/SettingsScreen.kt \
                  README.md
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Harden permanent deletion and media access'
          git push origin HEAD:main
