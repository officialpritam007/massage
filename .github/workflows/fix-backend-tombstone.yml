name: Fix Backend Tombstone Wiring

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-backend-tombstone.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct tombstone visibility wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('appwrite-functions/liquid-api/src/main.js')
          s=p.read_text()
          bad="""          waveform: sanitizeWaveform(source.waveform),
          createdAt: now,
          status: 'SENT',
          isDeleted: false,
          deletedForEveryone: false,
          hiddenFor,
          isEdited: false,"""
          good="""          waveform: sanitizeWaveform(source.waveform),
          createdAt: now,
          status: 'SENT',
          isDeleted: false,
          deletedForEveryone: false,
          hiddenFor: [],
          isEdited: false,"""
          if bad not in s: raise SystemExit('forward block not found')
          s=s.replace(bad,good,1)
          old="""          waveform: p.type === 'VOICE' ? sanitizeWaveform(p.waveform) : [],
          createdAt: now,
          status: 'SENT',
          isDeleted: false,
          deletedForEveryone: false,
          hiddenFor: [],
          isEdited: false,"""
          new="""          waveform: p.type === 'VOICE' ? sanitizeWaveform(p.waveform) : [],
          createdAt: now,
          status: 'SENT',
          isDeleted: false,
          deletedForEveryone: false,
          hiddenFor,
          isEdited: false,"""
          if old not in s: raise SystemExit('send block not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check appwrite-functions/liquid-api/src/main.js
      - name: Commit
        run: |
          git config user.name 'officialpritam007'
          git config user.email 'officialpritam07@gmail.com'
          git add appwrite-functions/liquid-api/src/main.js
          git commit -m 'Correct backend deletion tombstone visibility wiring'
          git push origin HEAD:main
