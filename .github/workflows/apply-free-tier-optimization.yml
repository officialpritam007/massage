name: Apply free-tier realtime optimization

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-free-tier-optimization.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Firestore realtime usage
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/src/main/java/com/example/data/repository/ChatRepository.kt')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  'db.document("users/$account").update("tokens.$device", token)\n          .addOnFailureListener { runAction { LiquidApi.call("profile") } }',
                  'db.document("users/$account")\n          .set(mapOf("tokens" to mapOf(device to token)), SetOptions.merge())\n          .addOnFailureListener { runAction { LiquidApi.call("profile") } }'
              ),
              (
                  '''          _messages.update { map -> map.filterKeys { it in active } }\n          next.forEach { conversation ->\n            observeConversation(conversation.id)\n            observePresence(conversation.id)\n          }''',
                  '''          _messages.update { map -> map.filterKeys { it in active } }\n          // Message + typing listeners are attached only when a conversation is opened.\n          // The chat list needs only the lightweight conversation-summary listener.'''
              ),
              ('if (resumed && ticks++ % 25 == 0) writePresence(true)',
               'if (resumed && ticks++ % 60 == 0) writePresence(true)'),
              ('System.currentTimeMillis() - heartbeatAt < 45_000',
               'System.currentTimeMillis() - heartbeatAt < 90_000'),
              ('System.currentTimeMillis() - user.lastActiveAt < 45_000',
               'System.currentTimeMillis() - user.lastActiveAt < 90_000'),
              (
                  '''  fun observeConversation(cid: String) {\n    if (messageListeners.containsKey(cid)) return\n    val limit = limits.getOrPut(cid) { 100 }''',
                  '''  fun observeConversation(cid: String) {\n    // Keep at most one heavy message/typing realtime stream active. Conversation summaries\n    // remain realtime through the lightweight chat-list listener.\n    messageListeners.keys.filter { it != cid }.toList().forEach { key ->\n      messageListeners.remove(key)?.remove()\n    }\n    presenceListeners.keys.filter { it != cid }.toList().forEach { key ->\n      presenceListeners.remove(key)?.remove()\n    }\n    observePresence(cid)\n    if (messageListeners.containsKey(cid)) return\n    val limit = limits.getOrPut(cid) { 60 }'''
              ),
              ('limits[cid] = (limits[cid] ?: 100) + 100',
               'limits[cid] = (limits[cid] ?: 60) + 60'),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count == 0:
                  raise SystemExit(f'Expected patch target not found: {old[:100]!r}')
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')

      - name: Verify architecture guardrails
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "FirebaseStorage\|firebase-storage\|firebase-functions" app/src app/build.gradle.kts gradle/libs.versions.toml
          grep -q 'limits.getOrPut(cid) { 60 }' app/src/main/java/com/example/data/repository/ChatRepository.kt
          grep -q 'ticks++ % 60' app/src/main/java/com/example/data/repository/ChatRepository.kt
          grep -q 'observePresence(cid)' app/src/main/java/com/example/data/repository/ChatRepository.kt
          git diff --check

      - name: Commit optimized source and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-free-tier-optimization.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/data/repository/ChatRepository.kt .github/workflows/apply-free-tier-optimization.yml
          git commit -m "Optimize realtime sync for free-tier usage"
          git push origin HEAD:main
