name: Build Android APK

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'chatgpt/**'
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Verify and Build Debug APK
    runs-on: ubuntu-latest
    env:
      LIQUID_API_URL: ${{ vars.LIQUID_API_URL || 'https://liquichat.sgp.appwrite.run' }}
      APPWRITE_ENDPOINT: ${{ vars.APPWRITE_ENDPOINT || 'https://sgp.cloud.appwrite.io/v1' }}
      APPWRITE_PROJECT_ID: ${{ vars.APPWRITE_PROJECT_ID || '6abae44b0030a4b3c0b4' }}
      APPWRITE_BUCKET_ID: ${{ vars.APPWRITE_BUCKET_ID || '6abae4e300352b37c209' }}
      APP_CHECK_PROVIDER: ${{ vars.APP_CHECK_PROVIDER || 'none' }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/firestore/package-lock.json

      - name: Validate backend configuration
        shell: bash
        run: |
          if [[ -z "$LIQUID_API_URL" ]]; then
            echo "::error::Missing LIQUID_API_URL."
            exit 1
          fi
          if [[ "$LIQUID_API_URL" != https://* ]]; then
            echo "::error::LIQUID_API_URL must start with https://"
            exit 1
          fi
          echo "Backend configuration is present."

      - name: Create environment files
        run: |
          printf '%s\n' '# Environment variables are supplied by GitHub Actions env' > .env.example
          printf '%s\n' '# Environment variables are supplied by GitHub Actions env' > .env

      - name: Create local.properties
        run: |
          printf '%s\n' 'MAPS_API_KEY=' > local.properties

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-9.3.1/bin" >> "$GITHUB_PATH"
          /tmp/gradle-9.3.1/bin/gradle --version

      - name: Run Firestore security-rule integration tests
        run: |
          npm ci --prefix tests/firestore
          npx --yes firebase-tools@14.15.1 emulators:exec --only firestore --project demo-liquid-chat "cd tests/firestore && npm test"

      - name: Run unit tests
        run: |
          /tmp/gradle-9.3.1/bin/gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK
        run: |
          /tmp/gradle-9.3.1/bin/gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: liquid-chat-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
