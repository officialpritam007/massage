name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    env:
      LIQUID_API_URL: ${{ vars.LIQUID_API_URL }}
      APPWRITE_ENDPOINT: ${{ vars.APPWRITE_ENDPOINT || 'https://sgp.cloud.appwrite.io/v1' }}
      APPWRITE_PROJECT_ID: ${{ vars.APPWRITE_PROJECT_ID || '6abae44b0030a4b3c0b4' }}
      APPWRITE_BUCKET_ID: ${{ vars.APPWRITE_BUCKET_ID || '6abae4e300352b37c209' }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate backend configuration
        shell: bash
        run: |
          if [[ -z "$LIQUID_API_URL" ]]; then
            echo "::error::Missing repository variable LIQUID_API_URL. Deploy appwrite-functions/liquid-api and set its HTTPS function domain in Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
          if [[ "$LIQUID_API_URL" != https://* ]]; then
            echo "::error::LIQUID_API_URL must start with https://"
            exit 1
          fi
          echo "Backend configuration is present."

      - name: Create environment files
        run: |
          printf '%s\n' '# Environment variables are supplied by GitHub Actions env' > .env.example
          printf '%s\n' '# Environment variables are supplied by GitHub Actions env' > .env

      - name: Create local.properties
        run: |
          printf '%s\n' 'MAPS_API_KEY=' > local.properties

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-9.3.1/bin" >> "$GITHUB_PATH"
          /tmp/gradle-9.3.1/bin/gradle --version

      - name: Build Debug APK
        run: |
          /tmp/gradle-9.3.1/bin/gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: liquid-chat-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
