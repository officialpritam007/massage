name: Build Android APK

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'chatgpt/**'
      - 'free/**'
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Verify and Build Debug APK
    runs-on: ubuntu-latest
    env:
      CLOUDINARY_CLOUD_NAME: ${{ vars.CLOUDINARY_CLOUD_NAME || 'mthzgqhv' }}
      CLOUDINARY_UPLOAD_PRESET: liquid_chat_owned_v1
      APP_CHECK_PROVIDER: ${{ vars.APP_CHECK_PROVIDER || 'none' }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/firestore/package-lock.json

      - name: Validate free-tier configuration
        shell: bash
        run: |
          if [[ -z "$CLOUDINARY_CLOUD_NAME" || -z "$CLOUDINARY_UPLOAD_PRESET" ]]; then
            echo "::error::Cloudinary cloud name and unsigned upload preset are required."
            exit 1
          fi
          echo "Firebase Auth + Firestore + direct Cloudinary configuration is present."

      - name: Create environment files
        run: |
          cat > .env <<EOF
          CLOUDINARY_CLOUD_NAME=$CLOUDINARY_CLOUD_NAME
          CLOUDINARY_UPLOAD_PRESET=$CLOUDINARY_UPLOAD_PRESET
          APP_CHECK_PROVIDER=$APP_CHECK_PROVIDER
          EOF
          cp .env .env.example

      - name: Create local.properties
        run: |
          printf '%s\n' 'MAPS_API_KEY=' > local.properties

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-9.3.1/bin" >> "$GITHUB_PATH"
          /tmp/gradle-9.3.1/bin/gradle --version

      - name: Run Firestore security-rule integration tests
        run: |
          npm ci --prefix tests/firestore
          npx --yes firebase-tools@14.15.1 emulators:exec --only firestore --project demo-liquid-chat "cd tests/firestore && npm test"

      - name: Test trusted cleanup ownership and failure handling
        run: python3 -m unittest discover -s tools/tests -v

      - name: Run unit tests
        run: |
          /tmp/gradle-9.3.1/bin/gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK
        run: |
          /tmp/gradle-9.3.1/bin/gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: liquid-chat-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
