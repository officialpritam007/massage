name: Apply Liquid Glass Conversation Overhaul

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-liquid-ui-overhaul.yml'
      - 'tools/apply_liquid_ui_overhaul.py'

permissions:
  contents: write

jobs:
  patch-build:
    name: Patch, test and build Liquid Glass UI
    runs-on: ubuntu-latest
    env:
      LIQUID_API_URL: ${{ vars.LIQUID_API_URL || 'https://liquichat.sgp.appwrite.run' }}
      APPWRITE_ENDPOINT: ${{ vars.APPWRITE_ENDPOINT || 'https://sgp.cloud.appwrite.io/v1' }}
      APPWRITE_PROJECT_ID: ${{ vars.APPWRITE_PROJECT_ID || '6abae44b0030a4b3c0b4' }}
      APPWRITE_BUCKET_ID: ${{ vars.APPWRITE_BUCKET_ID || '6abae4e300352b37c209' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Apply UI patch
        run: python3 tools/apply_liquid_ui_overhaul.py

      - name: Remove temporary patch files
        run: |
          rm -f tools/apply_liquid_ui_overhaul.py
          rm -f .github/workflows/apply-liquid-ui-overhaul.yml

      - name: Commit patched source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Overhaul conversation UI with premium Liquid Glass'
          git push origin HEAD:main

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Create CI environment files
        run: |
          printf '%s\n' '# Environment variables are supplied by GitHub Actions env' > .env.example
          printf '%s\n' '# Environment variables are supplied by GitHub Actions env' > .env
          printf '%s\n' 'MAPS_API_KEY=' > local.properties

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-9.3.1/bin/gradle --version

      - name: Run unit tests
        run: /tmp/gradle-9.3.1/bin/gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK
        run: /tmp/gradle-9.3.1/bin/gradle assembleDebug --no-daemon --stacktrace

      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: liquid-chat-liquid-glass-overhaul-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
