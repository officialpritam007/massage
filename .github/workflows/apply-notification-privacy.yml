name: Apply Notification Privacy

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-notification-privacy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/apply_notification_privacy.py
      - name: Validate backend syntax
        run: node --check appwrite-functions/liquid-api/src/main.js
      - name: Commit changes
        run: |
          git config user.name 'officialpritam007'
          git config user.email 'officialpritam07@gmail.com'
          git add app/src/main/java/com/example/data/model/Models.kt \
                  app/src/main/java/com/example/data/repository/ChatRepository.kt \
                  app/src/main/java/com/example/ui/screens/SettingsScreen.kt \
                  app/src/main/java/com/example/notifications/LiquidFirebaseMessagingService.kt \
                  appwrite-functions/liquid-api/src/main.js
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Add notification preview privacy and grouping'
          git push origin HEAD:main
