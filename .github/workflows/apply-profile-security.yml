name: Apply Profile Security

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-profile-security.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/apply_profile_security.py
      - name: Validate backend syntax
        run: node --check appwrite-functions/liquid-api/src/main.js
      - name: Commit changes
        run: |
          git config user.name 'officialpritam007'
          git config user.email 'officialpritam07@gmail.com'
          git add appwrite-functions/liquid-api/src/main.js \
                  app/src/main/java/com/example/data/repository/ChatRepository.kt \
                  app/src/main/java/com/example/ui/viewmodel/LiquidChatViewModel.kt \
                  app/src/main/java/com/example/ui/screens/SettingsScreen.kt
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Add username availability and report throttling'
          git push origin HEAD:main
