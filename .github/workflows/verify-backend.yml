name: Verify Backend Configuration

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-backend.yml'
      - 'tools/verify_backend.py'
      - 'firestore.rules'

permissions:
  contents: read

jobs:
  inspect:
    name: Read-only Firebase edition check
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install authenticated read client
        run: python -m pip install 'google-auth==2.43.0' 'requests==2.32.5'
      - name: Verify existing default database without changing it
        env:
          FIREBASE_PROJECT_ID: liquid-chat-v2
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python tools/verify_backend.py
